[package]
name = "runlens"
version = "0.1.0"
edition = "2024"
description = "A Linux command wrapper that reports process, resource, filesystem, and network activity."
readme = "README.md"
license = "MIT"
keywords = ["linux", "cli", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = [".scratch/", "AGENTS.md", "docs/"]

[[bin]]
name = "runlens"
path = "src/main.rs"
